# Data flows (framework §17, Master Plan §20).
#
# Every important data flow must document source, destination, data
# classification, sensitive content, external processors, and audit behavior.
# All flows are LOCAL ONLY; no external processors.

- flow: user-prompt-to-agent
  source: user (terminal stdin / CLI argument)
  destination: reasoning engine (src/reasoning/engine.ts)
  data_classification: internal
  contains_personal_data: false
  description: >-
    User's task description or chat prompt enters the reasoning engine.
    Treated as trusted (user instruction tier). Never written to ledger verbatim;
    the task is visible in agent session logs.
  retention: in-memory only; not persisted
  external_processors: []
  logs_raw_content: false
  deletion_path: process exit
  approval_required_for_permanent_write: false
  notes: "user instruction tier — highest trust; fenced from external content"

- flow: project-config-to-effective-config
  source: filesystem (.opencli/config.yaml, walked up from cwd)
  destination: layered config resolver (src/lib/config-scopes.ts)
  data_classification: internal
  contains_personal_data: false
  description: >-
    A checked-in project config file contributes to effective configuration.
    The `[security]` group is governed: a project scope may only TIGHTEN a
    control (enable enterprise, add denied_paths), never loosen one a lower
    scope set. Loosening attempts are dropped and recorded. Unknown/ill-typed
    keys are coerced away. The file is data, not instructions.
  retention: read per invocation; effective posture logged as effective_config audit event
  external_processors: []
  logs_raw_content: false
  deletion_path: process exit
  approval_required_for_permanent_write: false
  notes: "tighten-only merge; untrusted authorship (anyone who can open a PR)"

- flow: external-content-to-context
  source: filesystem (read_file, list_dir, grep), tool output
  destination: reasoning engine context window
  data_classification: internal
  contains_personal_data: maybe (user's own codebase)
  description: >-
    Repository files, tool outputs, and grep results enter the model context.
    Treated as UNTRUSTED DATA — fenced and never promoted to instruction authority.
    Any instruction-like text in external content is inert.
  retention: in-memory only; not persisted beyond the agent session
  external_processors: []
  logs_raw_content: false
  deletion_path: process exit
  approval_required_for_permanent_write: false
  notes: "untrusted content tier — prompt-injection defense (§43); evals verify this property"

- flow: tool-call-to-executor
  source: reasoning engine (parsed tool call)
  destination: executor (src/kernel/executor.ts)
  data_classification: internal
  contains_personal_data: false
  description: >-
    Structured tool call (name + validated arguments) flows from the reasoning
    engine to the executor. Zod-validated against the tool schema before reaching
    the policy engine. No raw model output reaches the executor.
  retention: in-memory only
  external_processors: []
  logs_raw_content: false
  deletion_path: process exit
  approval_required_for_permanent_write: false

- flow: executor-to-audit-ledger
  source: executor (src/kernel/executor.ts)
  destination: audit ledger (src/kernel/audit.ts → SQLite)
  data_classification: internal
  contains_personal_data: maybe (file paths, diff summaries)
  description: >-
    Before every mutating side effect, the executor writes a structured audit
    event to the hash-chained ledger. The write must succeed; if it fails the
    side effect does not run (no-audit-no-action invariant). Secrets are
    redacted before storage — the ledger records that a secret was touched plus
    a SHA-256 of the value, never the plaintext.
  retention: append-only; indefinite (user-controlled; export + delete is the only removal path)
  external_processors: []
  logs_raw_content: false
  deletion_path: "export JSONL backup, then delete the SQLite file (breaks chain; documented in runbook)"
  approval_required_for_permanent_write: false
  notes: "audit events are the primary forensic record; integrity protected by sha256 hash chain"

- flow: mutation-plan-to-snapshot-store
  source: executor step 3d (src/kernel/executor.ts)
  destination: snapshot store (src/kernel/snapshot.ts → filesystem)
  data_classification: internal
  contains_personal_data: maybe (user source code — before-state of edited files)
  description: >-
    Before every edit_file mutation, the executor captures the before-state as
    a content-addressed blob in the snapshot store. The blob is keyed by its
    sha256 hash and matched to the before_hash in the audit event, enabling
    one-command rollback. Written before the audit event; if the capture fails,
    the mutation is blocked.
  retention: indefinite until user deletes snapshot directory
  external_processors: []
  logs_raw_content: false
  deletion_path: manual removal of ~/.local/share/openllama/snapshots/ (makes edit_file rollback irrecoverable)
  approval_required_for_permanent_write: false

- flow: audit-ledger-to-siem-export
  source: audit ledger (SQLite)
  destination: stdout (JSONL) → external SIEM (Splunk, Elastic, etc.)
  data_classification: internal
  contains_personal_data: maybe (file paths, diff summaries)
  description: >-
    opencli audit export --siem emits all audit events as raw JSONL on stdout.
    The operator pipes this to their SIEM. OpenCLI itself does not transmit
    data externally; the operator controls the destination.
  retention: operator-controlled once exported
  external_processors: [operator-chosen SIEM — not controlled by OpenCLI]
  logs_raw_content: false
  deletion_path: operator-controlled
  approval_required_for_permanent_write: false
  notes: "exported events contain redacted secret fields; no plaintext secrets leave the ledger"

- flow: audit-ledger-to-otel-export
  source: audit ledger (SQLite)
  destination: stdout (JSONL) → OTel-compatible backend (Grafana Tempo, Splunk OTel, etc.)
  data_classification: internal
  contains_personal_data: maybe (file paths in attributes)
  description: >-
    opencli audit export --otel emits audit events as OTel LogRecord JSONL.
    Body carries full audit event JSON; key fields promoted to attributes for
    filtering. Operator routes to their OTLP backend; OpenCLI does not transmit.
  retention: operator-controlled
  external_processors: [operator-chosen OTLP backend — not controlled by OpenCLI]
  logs_raw_content: false
  deletion_path: operator-controlled
  approval_required_for_permanent_write: false

- flow: policy-engine-evaluation
  source: executor (proposed action + context)
  destination: policy engine (src/policy/engine.ts)
  data_classification: internal
  contains_personal_data: false
  description: >-
    Every proposed action is evaluated by the in-process policy engine
    before the approval gate. The engine receives the action, risk level,
    permission level, and context; it returns ALLOW / REQUIRE_APPROVAL /
    REQUIRE_CONFIRMATION / DENY with a reason code. All inputs and outputs are
    local; no network call.
  retention: in-memory only
  external_processors: []
  logs_raw_content: false
  deletion_path: process exit
  approval_required_for_permanent_write: false

- flow: transcript-to-session-store
  source: reasoning engine (src/reasoning/engine.ts)
  destination: session store (src/sessions/store.ts → SQLite)
  data_classification: internal
  contains_personal_data: maybe (user's codebase content in turns)
  description: >-
    Each agent turn (user instruction, assistant reasoning, tool results) is
    persisted to the session store after secret redaction. The store is operator
    convenience state: enables `opencli agent --resume` and `session list`. It is
    NOT the compliance record — the audit ledger holds that. The join key is
    correlation_id. Tool results are re-fenced as untrusted data on resume so a
    stored injection attempt gains no authority in the resumed session.
  retention: indefinite until `opencli session rm` or manual SQLite deletion
  external_processors: []
  logs_raw_content: false
  deletion_path: "opencli session rm <id> --yes (governed, audited); or delete sessions.sqlite directly"
  approval_required_for_permanent_write: false
  notes: "redactValue() applied to every turn content before write; tool outputs re-fenced on hydrate"

- flow: compaction-evicts-context
  source: context manager (src/reasoning/context-manager.ts) [planned — A2]
  destination: session store / audit ledger
  data_classification: internal
  contains_personal_data: maybe
  description: >-
    When the context window exceeds the configured budget, the context manager
    evicts the oldest fenced tool-result turns (structural compaction) or
    summarizes a span via a model call (model compaction). A context_compaction
    audit event is written before the in-memory context is mutated. Evicted
    content is referenced by sha256 in the audit event so forensics can locate
    the full content in the session store.
  retention: evicted content remains in session store; only removed from in-memory context
  external_processors: []
  logs_raw_content: false
  deletion_path: "context manager eviction is in-memory only; session store retains the original turns"
  approval_required_for_permanent_write: false
  notes: "A2 milestone; this flow entry is a forward declaration"

- flow: model-inference-local
  source: reasoning engine (src/reasoning/engine.ts)
  destination: local Ollama model server (localhost:11434)
  data_classification: internal
  contains_personal_data: maybe (user's codebase content in context window)
  description: >-
    The reasoning engine sends conversation context to the local Ollama server
    and streams back the model response. All inference is local; no data leaves
    the machine. The Ollama server is not controlled by OpenCLI; it is the
    user's own locally running instance.
  retention: in-memory only during session; Ollama may retain context per its own config
  external_processors: [Ollama local server — user-controlled, not OpenCLI]
  logs_raw_content: false
  deletion_path: per Ollama configuration
  approval_required_for_permanent_write: false
  notes: "data stays on the local machine; hybrid/cloud mode (future v0.8) would require a separate data-flow entry and additional controls"
