# Service catalog (framework §12, Master Plan §14).
#
# Every production service must be registered with owner, tier, risk level,
# dashboard, runbook, SLO, dependencies, data classification, and rollback path.

- service: opencli-agent
  owner: chris
  tier: local-only
  risk_level: high
  repo: .
  runtime: node
  dashboard: "opencli audit metrics"
  runbook: docs/runbook.md
  slo: docs/slo/opencli.md
  dependencies:
    - audit-ledger
    - snapshot-store
    - kill-switch-state
    - ollama (local model server)
  data_classification:
    - internal
  healthcheck: "opencli audit verify"
  deployment: manual (npm run build)
  rollback: docs/rollback.md
  alerts:
    - kill_switch_active
    - chain_broken
    - consecutive_denial_peak

- service: audit-ledger
  owner: chris
  tier: local-only
  risk_level: high
  repo: .
  runtime: sqlite (better-sqlite3)
  dashboard: "opencli audit show"
  runbook: docs/runbook.md
  slo: docs/slo/opencli.md
  dependencies: []
  data_classification:
    - internal
  healthcheck: "opencli audit verify"
  deployment: created on first write
  rollback: "append-only; export JSONL as backup before destructive ops"
  alerts:
    - chain_broken

- service: snapshot-store
  owner: chris
  tier: local-only
  risk_level: medium
  repo: .
  runtime: filesystem (content-addressed blobs)
  dashboard: "ls ~/.local/share/openllama/snapshots/ | wc -l"
  runbook: docs/runbook.md
  slo: docs/slo/opencli.md
  dependencies: []
  data_classification:
    - internal
  healthcheck: n/a
  deployment: created on first write
  rollback: "blobs are recreatable from git history"
  alerts: []

- service: rollback-engine
  owner: chris
  tier: local-only
  risk_level: high
  repo: .
  runtime: node
  dashboard: "opencli audit metrics (rollback_count)"
  runbook: docs/runbook.md
  slo: docs/slo/opencli.md
  dependencies:
    - audit-ledger
    - snapshot-store
  data_classification:
    - internal
  healthcheck: n/a
  deployment: embedded in opencli CLI
  rollback: "rollback engine itself cannot be rolled back; re-apply mutation manually"
  alerts: []

- service: kill-switch
  owner: chris
  tier: local-only
  risk_level: high
  repo: .
  runtime: filesystem (JSON state file)
  dashboard: "opencli kill-switch status"
  runbook: docs/runbook.md
  slo: docs/slo/opencli.md
  dependencies: []
  data_classification:
    - internal
  healthcheck: "opencli kill-switch status"
  deployment: created on first activation
  rollback: "opencli kill-switch deactivate"
  alerts:
    - kill_switch_active

- service: session-store
  owner: chris
  tier: local-only
  risk_level: medium
  repo: .
  runtime: sqlite (better-sqlite3)
  dashboard: "opencli session list"
  runbook: docs/runbook.md
  slo: docs/slo/opencli.md
  dependencies:
    - audit-ledger
  data_classification:
    - internal
  healthcheck: "opencli session list"
  deployment: created on first agent run
  rollback: "opencli session rm <id> --yes (per-session); delete sessions.sqlite to wipe all"
  alerts: []
  notes: >-
    Operator convenience state — NOT a compliance record. Secrets in transcript
    content are redacted via redactValue() before storage. The audit ledger
    (not this store) is the authoritative forensic record. session rm is
    a MutatingTool routed through the kernel (audited).

- service: hook-runner
  owner: chris
  tier: local-only
  risk_level: medium
  repo: .
  runtime: node (subprocess spawn)
  dashboard: "opencli audit show (filter action=hook_execution)"
  runbook: docs/hooks.md
  slo: docs/slo/opencli.md
  dependencies:
    - audit-ledger
  data_classification:
    - internal
    - external
  healthcheck: "n/a (invoked per agent run from .opencli/hooks.json)"
  deployment: loaded per agent run when .opencli/hooks.json is present
  rollback: "remove or empty .opencli/hooks.json"
  alerts: []
  notes: >-
    TIGHTEN-ONLY extensibility layer (v0.8 B5). pre_tool hooks may BLOCK a tool
    but can never permit one the kernel blocks, grant approval, or lower a
    permission level. Hook stdout is UNTRUSTED external content — fenced via
    fenceUntrusted before context entry. Every hook run writes a hook_execution
    audit event; fail-closed (block) on spawn failure/timeout for pre_tool.
    Hooks run at the engine dispatch layer as an additional restriction and can
    never bypass the executor's no-audit-no-action gate.
