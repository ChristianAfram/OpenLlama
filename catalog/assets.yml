# Asset inventory (framework §13, Master Plan §20).
#
# Every important asset must be tracked with owner, environment, data
# classification, backup status, access controls, and known risks.
# All assets are LOCAL ONLY (local-only deployment; no cloud infrastructure).

- asset: audit-ledger
  type: database
  owner: chris
  environment: local
  data_classification: internal
  description: >-
    Append-only, hash-chained SQLite database recording every agent action.
    The no-audit-no-action invariant makes this the most critical asset.
  path: "~/.local/share/openllama/audit.sqlite (default; overridable via OPENLLAMA_AUDIT_DB)"
  backup: manual (export JSONL before destructive ops; see docs/rollback.md)
  restore_tested: false
  access:
    - opencli-agent (src/kernel/audit.ts — append-only; UPDATE/DELETE blocked)
  risks:
    - ledger corruption breaks the hash chain and blocks the kernel
    - SQLite file could be deleted; no automatic backup
    - no remote/off-box replication at v0.7
  notes: "DELETE/UPDATE blocked at DB level via SQLITE_DBCONFIG_DEFENSIVE + triggers"

- asset: snapshot-store
  type: filesystem
  owner: chris
  environment: local
  data_classification: internal
  description: >-
    Content-addressed blob store capturing before-state of every reversible
    mutation (edit_file). Keyed by sha256:<hex> matching the before_hash in
    the audit event. Required for edit_file rollback.
  path: "~/.local/share/openllama/snapshots/"
  backup: "blobs are recreatable from git history; losing them makes edit_file rollback irrecoverable"
  restore_tested: false
  access:
    - opencli-agent (src/kernel/snapshot.ts — write on mutation plan, read on rollback)
  risks:
    - blobs can grow unbounded (no GC in v0.7)
    - if snapshots are deleted, edit_file rollback falls back to irrecoverable path with manual instructions

- asset: kill-switch-state
  type: filesystem
  owner: chris
  environment: local
  data_classification: internal
  description: >-
    JSON state file tracking whether the global kill switch is active.
    Survives process restarts; read on every executor call when switch is active.
  path: "~/.config/openllama/kill-switch.json (OPENLLAMA_CONFIG_DIR override)"
  backup: recreatable (opencli kill-switch deactivate resets state)
  restore_tested: true
  access:
    - opencli-agent (src/kernel/kill-switch.ts — read/write)
  risks:
    - stale activated state blocks all mutating tools after crash/restart
    - mitigated by opencli kill-switch status and deactivate commands

- asset: agent-config
  type: filesystem
  owner: chris
  environment: local
  data_classification: internal
  description: >-
    JSON configuration file for model, host, and session preferences.
    Non-sensitive (does not contain secrets or API keys).
  path: "~/.config/openllama/config.json"
  backup: n/a (recreatable from defaults or .env.example)
  restore_tested: true
  access:
    - opencli-agent (src/lib/config.ts — read on startup)
  risks:
    - misconfigured host/model causes connection errors; recoverable

- asset: policy-bundle
  type: filesystem
  owner: chris
  environment: local
  data_classification: internal
  description: >-
    TypeScript policy engine and rules that govern all agent actions. Evaluated
    in-process by the policy engine. Tampering with policy source
    (src/policy/rules/) weakens the governance guarantees.
  path: "src/policy/ (source); dist/ (compiled)"
  backup: tracked in git; history is the backup
  restore_tested: true
  access:
    - opencli-agent (src/policy/engine.ts — read-only at runtime)
    - CI (policy.yml — validates on every push)
  risks:
    - modified policy files could weaken enforcement; mitigated by CI policy gate
    - exception_gate enforced by CI — expired exception fails the build

- asset: eval-suite
  type: filesystem
  owner: chris
  environment: local
  data_classification: internal
  description: >-
    Deterministic AI eval harness (src/evals/) covering 7 categories.
    Structural guarantees; results are independent of the live model.
    Hard 100% gates for prompt-injection and destructive-refusal.
  path: "src/evals/"
  backup: tracked in git
  restore_tested: true
  access:
    - CI (evals.yml — runs on every push)
    - developer (npm run eval)
  risks:
    - eval regressions are detected immediately via CI gate

- asset: session-store
  type: database
  owner: chris
  environment: local
  data_classification: internal
  description: >-
    SQLite database storing resumable agent transcripts (turns) and session
    metadata. Operator convenience state — deletable with `session rm`. Distinct
    from the audit ledger: mutable, not hash-chained, not a compliance record.
    All transcript content is secret-redacted before storage.
  path: "~/.local/share/openllama/sessions.sqlite (default; overridable via OPENCLI_SESSION_DB)"
  backup: "manual; losing this file prevents session resume but does not affect audit integrity"
  restore_tested: false
  access:
    - opencli-agent (src/sessions/store.ts — create/appendTurn/finish/remove)
    - opencli session (src/commands/session.ts — list/show/rm via MutatingTool)
  risks:
    - stored transcript content could contain sensitive codebase data; mitigated by secret redaction
    - file is deletable without kernel approval (direct filesystem access); session rm is the governed path
    - no automatic backup; losing sessions.sqlite loses resume history only
  notes: "correlation_id is the join key back to the audit ledger for forensics"

- asset: sbom
  type: artifact
  owner: chris
  environment: local
  data_classification: public
  description: >-
    CycloneDX 1.6 JSON SBOM listing all runtime and dev dependencies with
    component versions, hashes, and license identifiers. Generated by
    @cyclonedx/cyclonedx-npm (npm run sbom). Used for supply-chain audits.
  path: sbom.json (repo root; regenerated in CI via sbom.yml)
  backup: versioned in git; regenerated on each release
  restore_tested: true
  access:
    - public (committed to repo)
    - CI (sbom.yml — regenerates and validates on every push)
  risks:
    - committed sbom.json can drift from actual deps if not regenerated after package changes
    - mitigated by CI re-generation and validation
