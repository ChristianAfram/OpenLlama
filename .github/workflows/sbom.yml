name: sbom

# SBOM generation and validation (Prompt 11 / framework §15, §34, Master Plan §16).
#
# Generates a CycloneDX 1.6 JSON SBOM from the npm dependency tree and validates
# that it is well-formed JSON with the expected bomFormat. The generated sbom.json
# is uploaded as a workflow artifact. The committed sbom.json in the repo root is
# the canonical copy for supply-chain audits; this job re-generates to catch drift.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  sbom:
    name: sbom · generate & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM
        run: npm run sbom

      - name: Validate SBOM is well-formed JSON with CycloneDX format
        run: |
          python3 -c "
          import json, sys
          with open('sbom.json') as f:
              s = json.load(f)
          assert s.get('bomFormat') == 'CycloneDX', f'unexpected bomFormat: {s.get(\"bomFormat\")}'
          assert s.get('specVersion'), 'missing specVersion'
          assert isinstance(s.get('components'), list), 'missing components array'
          print(f'SBOM valid: CycloneDX {s[\"specVersion\"]}, {len(s[\"components\"])} components')
          "

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 90
